name: CI
on: [push, pull_request]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile both bots
        run: python -m compileall -q shop_bot admin_bot
      - name: Fail if secrets-looking strings are committed
        run: |
          ! grep -rnE "sk-[A-Za-z0-9]{32,}|[0-9]{8,}:AA[A-Za-z0-9_-]{30,}" --include=*.py --include=*.md --include=*.txt --include=*.yml . 
